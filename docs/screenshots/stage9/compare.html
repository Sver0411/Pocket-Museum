<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Museum · Stage 9 前后对比</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#343b3d;font:15px/1.6 system-ui}header{padding:20px 4vw;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}h1{font-size:18px;margin:0 auto 0 0}select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #c9c9c2;background:#fff}main{max-width:1480px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px}img{display:block;max-width:100%;max-height:78vh;margin:auto;border:1px solid #ddd;border-radius:10px}footer{padding:0 24px 24px;font-size:13px;color:#656c6d}@media(max-width:650px){main{grid-template-columns:1fr}img{max-height:70vh}}</style>
<header><h1>Pocket Museum · Stage 9</h1><select id="device" aria-label="掌机"><option value="gb">Game Boy</option><option value="gba">Game Boy Advance</option><option value="sp">GBA SP</option><option value="ds">DS Lite</option><option value="3ds">3DS</option><option value="psp">PSP</option><option value="vita">PS Vita</option></select><select id="size" aria-label="视口"><option value="">桌面</option><option value="-mobile">手机</option></select><button id="focus">查看专注模式</button></header>
<main><figure><figcaption id="leftCaption">优化前</figcaption><img id="before" alt="优化前实际浏览器截图"></figure><figure><figcaption id="rightCaption">优化后</figcaption><img id="after" alt="优化后实际浏览器截图"></figure></main>
<footer>截图来自本地实际页面。桌面 1440 × 1000，手机 390 × 844。专注模式对比使用同一视口；Game Boy 与 GBA SP 提供专注模式。游戏与系统的动态画面、时钟可能不同。</footer>
<script>let mode=false;const d=document.querySelector('#device'),s=document.querySelector('#size'),f=document.querySelector('#focus');function update(){f.hidden=!['gb','sp'].includes(d.value);if(f.hidden)mode=false;document.querySelector('#before').src=(mode?'after/':'before/')+d.value+s.value+'.png';document.querySelector('#after').src='after/'+d.value+(mode?'-focus-'+(s.value?'390x844':'1440x1000'):s.value)+'.png';document.querySelector('#leftCaption').textContent=mode?'完整机身':'优化前';document.querySelector('#rightCaption').textContent=mode?'专注模式':'优化后';f.textContent=mode?'查看版本对比':'查看专注模式'}d.onchange=s.onchange=()=>{mode=false;update()};f.onclick=()=>{mode=!mode;update()};update();</script></html>
